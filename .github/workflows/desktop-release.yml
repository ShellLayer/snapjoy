name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to a GitHub prerelease
        type: boolean
        default: true
      macos_image:
        description: Standard Mac image (alternate pool when the default is queued)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
      checks:
        description: Full suite, or camera/video regression after a verified full baseline
        type: choice
        default: full
        options:
          - full
          - studio
      target:
        description: Build all platforms or verify one platform independently
        type: choice
        default: all
        options:
          - all
          - macOS-Apple-Silicon
          - macOS-Intel-Rosetta
          - Windows-x64
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ (matrix.runner == 'macos-15' && inputs.macos_image) || matrix.runner }}
    timeout-minutes: 35
    env:
      SNAPJOY_PACKAGE_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # x64 Mac uses Rosetta because Intel-hosted VMs expose no WebGL.
        include: ${{ fromJSON(
          inputs.target == 'macOS-Apple-Silicon' && '[{"name":"macOS-Apple-Silicon","runner":"macos-15","arch":"arm64","tools-arch":"arm64","command":"npm run dist:mac -- --arm64"}]' ||
          inputs.target == 'macOS-Intel-Rosetta' && '[{"name":"macOS-Intel-Rosetta","runner":"macos-15","arch":"x64","tools-arch":"arm64","command":"npm run dist:mac -- --x64"}]' ||
          inputs.target == 'Windows-x64' && '[{"name":"Windows-x64","runner":"windows-2025","arch":"x64","tools-arch":"x64","command":"npm run dist -- --publish never"}]' ||
          '[{"name":"macOS-Apple-Silicon","runner":"macos-15","arch":"arm64","tools-arch":"arm64","command":"npm run dist:mac -- --arm64"},{"name":"macOS-Intel-Rosetta","runner":"macos-15","arch":"x64","tools-arch":"arm64","command":"npm run dist:mac -- --x64"},{"name":"Windows-x64","runner":"windows-2025","arch":"x64","tools-arch":"x64","command":"npm run dist -- --publish never"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.tools-arch }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install the exact Electron architecture
        env:
          ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
        run: npx install-electron
      - name: Select available test graphics backend
        run: node tools/probe-graphics.cjs
      - name: Run functional and platform tests
        if: inputs.checks != 'studio'
        run: npm test
      - name: Run camera and recording regression tests
        if: inputs.checks == 'studio'
        run: npm test -- tests/studio.spec.cjs
      - name: Build native packages
        run: ${{ matrix.command }}
      - name: Verify macOS bundle metadata and signature
        if: runner.os == 'macOS'
        run: node tools/verify-mac-bundle.cjs
      - name: Check packaged app
        env:
          DEBUG: pw:browser
        run: npm run smoke:package
      - name: Check Windows portable app
        if: runner.os == 'Windows'
        run: node tools/smoke-portable.cjs
      - name: Check Windows installer
        if: runner.os == 'Windows'
        run: node tools/smoke-installer.cjs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.name }}
          path: |
            docs/1.3.0/
            test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            release/1.3.0/*.dmg
            release/1.3.0/*.zip
            release/1.3.0/*.exe
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish verified downloads
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && (!inputs.target || inputs.target == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release/1.3.0
          merge-multiple: true
      - name: Create checksums
        run: node tools/release-files.cjs
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag and package version differ" >&2
            exit 1
          fi
          gh release create "$TAG" release/1.3.0/*.dmg release/1.3.0/*.zip release/1.3.0/*.exe release/1.3.0/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SnapJoy ${VERSION} · 变装摄影棚 · 照片与录像" \
            --notes-file docs/releases/1.3.0.md --prerelease
